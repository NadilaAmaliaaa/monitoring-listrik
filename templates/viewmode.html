<!doctype html>
<html class="light" lang="id">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>PELITA — Pemantauan Energi Listrik</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&family=Noto+Sans:wght@400;500;700&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            primary: "#136dec",
            "background-light": "#f8fafc",
            success: "#059669",
            warning: "#d97706",
            danger:  "#dc2626",
          },
          fontFamily: {
            display: ["Space Grotesk", "sans-serif"],
            sans:    ["Noto Sans", "sans-serif"],
          },
        },
      },
    };
  </script>
  <style type="text/tailwindcss">
    .material-symbols-outlined {
      font-variation-settings: "FILL" 0, "wght" 400, "GRAD" 0, "opsz" 24;
    }
    body { font-family:"Space Grotesk",sans-serif; @apply bg-background-light; }
    .table-monitor th { @apply text-[10px] font-bold text-slate-400 uppercase tracking-wider px-2 py-1; }
    .table-monitor td { @apply px-2 text-[12px] border-t border-slate-50 py-[5px]; }
    .phase-label      { @apply size-5 rounded flex items-center justify-center text-[11px] text-white font-bold; }
    .card-footer-item  { @apply flex flex-col; }
    .card-footer-label { @apply text-[9px] font-bold uppercase tracking-wider text-slate-400 leading-tight; }
    .card-footer-value { @apply text-[11px] font-bold font-mono text-slate-700 leading-tight; }
  </style>
  <style>
    html,body{height:100vh;overflow:hidden;margin:0}
    body{display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:6px;padding:10px 12px 8px;box-sizing:border-box}

    /* card states */
    .dept-card-critical{border-color:#fca5a5!important;background:#fff8f8!important}
    .dept-card-critical .card-header-bg{background-color:#fff0f0!important;border-bottom-color:#fecaca!important}
    .dept-card-critical .card-status-dot{background-color:#dc2626!important;animation:blink 1s ease-in-out infinite}
    .dept-card-critical .card-title{color:#b91c1c!important}
    .dept-card-critical .card-badge{display:flex!important}
    .dept-card-critical .table-monitor td{border-top-color:#fee2e2!important}
    .dept-card-critical .card-footer-bg{background-color:#fff0f0!important;border-top-color:#fecaca!important}
    .dept-card-critical .card-footer-label{color:#f87171!important}
    .dept-card-critical .card-footer-value{color:#dc2626!important}
    .dept-card-critical .val-highlight{color:#dc2626!important;font-weight:800!important}

    .dept-card-warning{border-color:#fcd34d!important;background:#fffdf0!important}
    .dept-card-warning .card-header-bg{background-color:#fffbeb!important;border-bottom-color:#fde68a!important}
    .dept-card-warning .card-status-dot{background-color:#d97706!important;animation:blink 1.4s ease-in-out infinite}
    .dept-card-warning .card-title{color:#b45309!important}
    .dept-card-warning .card-badge{display:flex!important;background-color:#fef3c7!important;color:#92400e!important;border-color:#fde68a!important}
    .dept-card-warning .card-footer-bg{background-color:#fffbeb!important;border-top-color:#fde68a!important}
    .dept-card-warning .card-footer-label{color:#d97706!important}
    .dept-card-warning .card-footer-value{color:#d97706!important}
    .dept-card-warning .val-highlight{color:#d97706!important;font-weight:800!important}

    @keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}

    .card-badge{
      display:none;align-items:center;justify-content:center;
      font-size:8px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;
      padding:2px 6px;border-radius:4px;
      background-color:#fee2e2;color:#b91c1c;border:1px solid #fca5a5;
      white-space:nowrap;line-height:1.4;
    }

    /* alarm panel */
    .alarm-card{background:#fff;border:1px solid #fca5a5;border-radius:12px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 1px 3px rgba(0,0,0,.06)}
    .alarm-card-header{padding:7px 12px;background:#fef2f2;border-bottom:1px solid #fecaca;display:flex;align-items:center;gap:7px;flex-shrink:0}
    .alarm-pulse-dot{width:7px;height:7px;border-radius:50%;background:#dc2626;animation:blink 1s ease-in-out infinite;flex-shrink:0}
    .alarm-card-title{font-size:10px;font-weight:800;color:#b91c1c;letter-spacing:.04em;flex:1}
    .alarm-count-badge{font-size:9px;font-weight:800;background:#dc2626;color:#fff;padding:1px 6px;border-radius:9999px}
    .alarm-list{flex:1;overflow-y:auto}
    .alarm-item{display:flex;flex-direction:column;gap:2px;padding:6px 12px;border-bottom:1px solid #fff5f5}
    .alarm-item:last-child{border-bottom:none}
    .alarm-item-row{display:flex;align-items:center;gap:6px}
    .alarm-building{font-size:10px;font-weight:700;color:#1e293b}
    .alarm-time{margin-left:auto;font-size:9px;color:#94a3b8;font-family:monospace}
    .alarm-msg{font-size:9px;color:#64748b;line-height:1.4;padding-left:1px}
    .alarm-empty{font-size:10px;color:#94a3b8;padding:12px;text-align:center}

    /* normal alarm card state */
    .alarm-card-normal{border-color:#bbf7d0}
    .alarm-card-normal .alarm-card-header{background:#f0fdf4;border-bottom-color:#bbf7d0}
    .alarm-card-normal .alarm-pulse-dot{background:#059669}
    .alarm-card-normal .alarm-card-title{color:#166534}
    .alarm-card-normal .alarm-count-badge{background:#059669}

    /* summary */
    .summary-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;align-items:stretch}
    .sum-section-label{font-size:8px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#94a3b8;margin-bottom:4px;display:flex;align-items:center;gap:5px}
    .sum-section-label::after{content:'';flex:1;height:.5px;background:#e2e8f0}
    .sum-panel{background:#fff;border:1px solid #e2e8f0;border-radius:8px;overflow:hidden;display:flex;flex-direction:column;height:100%}

    /* phase table */
    .ph-table{width:100%;border-collapse:collapse;font-size:10px}
    .ph-table th{font-size:8px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:#94a3b8;padding:4px 8px;text-align:left;background:#f8fafc;border-bottom:1px solid #f1f5f9}
    .ph-table th:not(:first-child){text-align:right}
    .ph-table td{padding:4px 8px;border-bottom:1px solid #f8fafc;color:#334155}
    .ph-table tr:last-child td{border-bottom:none}
    .ph-table td:not(:first-child){text-align:right;font-family:monospace;font-size:10px}
    .ibar-wrap{width:44px;height:4px;background:#f1f5f9;border-radius:2px;display:inline-block;vertical-align:middle;overflow:hidden}
    .ibar{height:100%;border-radius:2px}
    .ibar-ok{background:#059669} .ibar-warn{background:#d97706}
    .ipct{font-size:8px;margin-left:3px;vertical-align:middle;font-family:monospace}
    .ipct-ok{color:#059669} .ipct-warn{color:#d97706}

    /* bar chart */
    .load-inner{padding:8px 10px;display:flex;flex-direction:column;flex:1}
    .load-bars{flex:1;display:flex;align-items:flex-end;gap:4px;height:52px;margin-bottom:3px}
    .bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;height:100%}
    .bar-track{width:100%;flex:1;background:#f1f5f9;border-radius:3px 3px 0 0;display:flex;align-items:flex-end;overflow:hidden}
    .bar-fill{width:100%;border-radius:3px 3px 0 0}
    .bar-name{font-size:7px;color:#94a3b8;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;width:100%}
    .bar-val{font-size:8px;font-weight:700;color:#64748b;font-family:monospace}
    .load-axis{display:flex;justify-content:space-between;font-size:8px;color:#cbd5e1;margin-bottom:4px}
    .load-divider{height:.5px;background:#f1f5f9;margin-bottom:4px}
    .load-meta{font-size:10px;color:#64748b}
    .load-meta strong{color:#1e293b;font-family:monospace}
    .load-meta-sub{font-size:10px;color:#64748b;margin-top:1px}
    .load-meta-sub span{color:#dc2626;font-weight:700}

    /* skeleton */
    .skel{background:linear-gradient(90deg,#f1f5f9 25%,#e2e8f0 50%,#f1f5f9 75%);background-size:200% 100%;animation:shimmer 1.2s infinite;border-radius:4px}
    @keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
  </style>
</head>

<body>

  <!-- ═══ HEADER ═══ -->
  <header class="flex items-stretch gap-3 shrink-0">

    <!-- Brand + Login -->
    <div class="flex flex-col bg-white border border-slate-200 rounded-xl px-5 py-3 shadow-sm" style="min-width:280px">
      <div class="flex justify-between items-start">
        <div class="flex items-start gap-3">
          <div class="size-9 text-primary mt-1">
            <svg fill="currentColor" viewBox="0 0 24 24"><path d="M13 2L3 14h7l-1 8 10-12h-7l1-8z"/></svg>
          </div>
          <div class="flex flex-col gap-2">
            <h1 class="text-base font-bold tracking-wide text-slate-800 leading-none">PELITA</h1>
            <span class="text-[9px] font-bold text-primary mt-1 px-2 py-0.5 border border-primary rounded inline-block">
              PEMANTAUAN ENERGI LISTRIK 3 FASA
            </span>
          </div>
        </div>
        <div class="flex items-center gap-1 text-slate-600 mt-1">
          <span class="material-symbols-outlined" style="font-size:14px">schedule</span>
          <span class="text-[12px] font-semibold font-mono" id="current-time">--:--:--</span>
        </div>
      </div>
      <div class="border-t border-slate-100 my-3"></div>
      <div class="flex items-center justify-between">
        <span class="text-[10px] text-slate-400">Monitoring System</span>
        <a href="{{ url_for('auth.login') }}"
           class="flex items-center gap-1 text-[11px] font-semibold px-3 py-1.5 rounded-md bg-primary text-white hover:bg-primary/90 transition">
          <span class="material-symbols-outlined" style="font-size:13px">login</span>
          Login
        </a>
      </div>
    </div>

    <!-- Total Energi Bulan Ini -->
    <div class="flex-1 bg-white border border-slate-200 rounded-xl px-4 py-2.5 shadow-sm flex items-center justify-between relative overflow-hidden group">
      <div class="relative z-10">
        <p class="text-slate-500 text-[8px] font-bold uppercase tracking-[0.2em] mb-0.5">Total Energi Bulan Ini</p>
        <div class="flex items-baseline gap-2">
          <h3 class="text-2xl font-extrabold tracking-tight text-primary" id="hdr-kwh">—</h3>
          <span class="text-base font-bold text-slate-400">kWh</span>
        </div>
      </div>
      <span class="material-symbols-outlined absolute right-[-8px] top-[-8px] text-primary/5 group-hover:text-primary/10 transition-colors" style="font-size:64px">bolt</span>
    </div>

    <!-- Estimasi Biaya Bulan Ini -->
    <div class="flex-1 bg-white border border-slate-200 rounded-xl px-4 py-2.5 shadow-sm flex items-center justify-between relative overflow-hidden group">
      <div class="relative z-10">
        <p class="text-slate-500 text-[8px] font-bold uppercase tracking-[0.2em] mb-0.5">Estimasi Biaya Bulan Ini</p>
        <div class="flex items-baseline gap-2">
          <span class="text-base font-bold text-slate-400">Rp</span>
          <h3 class="text-2xl font-extrabold tracking-tight text-slate-800" id="hdr-cost">—</h3>
        </div>
      </div>
      <span class="material-symbols-outlined absolute right-[-8px] top-[-8px] text-slate-100 group-hover:text-slate-200 transition-colors" style="font-size:64px">payments</span>
    </div>
  </header>

  <!-- ═══ MAIN GRID ═══ -->
  <main style="overflow:auto;min-height:0">
    <div class="grid grid-cols-4 gap-3" id="building-grid"
         style="grid-template-columns:repeat(4,1fr);overflow:auto">
      <!-- diisi JS -->
      <div class="col-span-4 flex items-center justify-center text-slate-400 text-sm">
        <span class="skel" style="width:200px;height:20px"></span>
      </div>
    </div>
  </main>

  <!-- ═══ SUMMARY ═══ -->
  <section class="shrink-0">
    <div class="summary-grid">

      <!-- Keseimbangan Fasa -->
      <div>
        <div class="sum-section-label">Keseimbangan Fase per Gedung</div>
        <div class="sum-panel">
          <table class="ph-table">
            <thead>
              <tr><th>Gedung</th><th>R (A)</th><th>S (A)</th><th>T (A)</th><th>Imbalance</th></tr>
            </thead>
            <tbody id="phase-tbody">
              <tr><td colspan="5" class="text-center text-slate-300 text-[10px] py-2">Memuat...</td></tr>
            </tbody>
          </table>
        </div>
      </div>

      <!-- Distribusi Beban -->
      <div>
        <div class="sum-section-label">Distribusi Beban Hari Ini</div>
        <div class="sum-panel">
          <div class="load-inner">
            <div class="load-bars" id="load-bars">
              <div class="bar-col">
                <div class="bar-track"><div class="bar-fill skel" style="height:60%"></div></div>
                <div class="bar-name skel" style="width:80%;height:8px;margin-top:2px"></div>
              </div>
            </div>
            <div class="load-axis"><span id="load-axis-min">0 kWh</span><span id="load-axis-max">— kWh</span></div>
            <div class="load-divider"></div>
            <div class="load-meta">Total hari ini: <strong id="load-total">—</strong></div>
            <div class="load-meta-sub" id="load-top">—</div>
          </div>
        </div>
      </div>

    </div>
  </section>

<script>
(function () {
  const REFRESH_RT_MS   = 5000;   // realtime card: setiap 5 detik
  const REFRESH_SLOW_MS = 60000;  // header & summary: setiap 1 menit

  const BAR_COLORS = ['#dc2626','#d97706','#136dec','#059669','#7c3aed','#0891b2','#be185d'];

  // ── Clock ────────────────────────────────────────────────────────────────
  function tick() {
    const now = new Date();
    const t   = [now.getHours(), now.getMinutes(), now.getSeconds()]
      .map(n => String(n).padStart(2,'0')).join(':');
    document.getElementById('current-time').textContent = t;
  }
  setInterval(tick, 1000);
  tick();

  // ── Format helpers ────────────────────────────────────────────────────────
  function fmtKwh(n) {
    if (!n && n !== 0) return '—';
    return Number(n).toLocaleString('id-ID', {maximumFractionDigits:2});
  }
  function fmtCost(n) {
    if (!n && n !== 0) return '—';
    if (n >= 1e9) return (n/1e9).toFixed(2) + ' M';
    if (n >= 1e6) return (n/1e6).toFixed(3).replace('.',',') + ' Jt';
    if (n >= 1e3) return (n/1e3).toFixed(1) + ' Rb';
    return Math.round(n).toLocaleString('id-ID');
  }
  function fmtNum(n, dec=1) {
    return Number(n || 0).toFixed(dec);
  }
  function fmtW(w) {
    if (w >= 1000) return (w/1000).toFixed(1)+'k';
    return Math.round(w)+'';
  }

  // ── Header ────────────────────────────────────────────────────────────────
  function loadHeader() {
    fetch('/api/view/header')
      .then(r => r.json())
      .then(d => {
        document.getElementById('hdr-kwh').textContent  = fmtKwh(d.total_kwh);
        document.getElementById('hdr-cost').textContent = fmtCost(d.total_cost);
      }).catch(()=>{});
  }

  // ── Building Cards ────────────────────────────────────────────────────────
  function phaseColor(ph) {
    return {R:'bg-red-500', S:'bg-amber-500', T:'bg-black'}[ph] || 'bg-slate-400';
  }

  function buildingCard(b) {
    const statusClass = b.alarm_status === 'critical' ? 'dept-card-critical'
                      : b.alarm_status === 'warning'  ? 'dept-card-warning'
                      : '';
    const badgeText   = b.alarm_status === 'critical' ? 'ALARM AKTIF'
                      : b.alarm_status === 'warning'  ? 'PERINGATAN'
                      : '';
    const dotColor    = b.alarm_status !== 'normal' ? '' : 'bg-success';

    const sensorRows = b.sensors.map(s => `
      <tr>
        <td><span class="phase-label ${phaseColor(s.phase)}">${s.phase}</span></td>
        <td>${fmtNum(s.voltage,1)}</td>
        <td>${fmtNum(s.current,1)}</td>
        <td>${fmtW(s.power)}</td>
      </tr>`).join('');

    return `
    <div class="${statusClass} bg-white border border-slate-200 rounded-xl overflow-hidden shadow-sm flex flex-col">
      <div class="card-header-bg px-3 py-2 border-b border-slate-100 flex justify-between items-center bg-slate-50/50">
        <div class="flex items-center gap-2">
          <div class="card-status-dot size-2 ${dotColor} rounded-full"></div>
          <h4 class="card-title font-bold text-slate-800 text-[11px]">${b.building_name}</h4>
        </div>
        <span class="card-badge">${badgeText}</span>
      </div>
      <div class="flex-1 p-2 min-h-0">
        <table class="w-full text-left table-monitor">
          <thead><tr><th>Fase</th><th>V</th><th>A</th><th>W</th></tr></thead>
          <tbody class="font-mono font-medium text-slate-700">${sensorRows}</tbody>
        </table>
      </div>
      <div class="card-footer-bg px-3 py-1.5 bg-slate-50 border-t border-slate-100 grid grid-cols-2 gap-2 shrink-0">
        <div class="card-footer-item">
          <span class="card-footer-label">Energi Hari Ini (kWh)</span>
          <span class="card-footer-value">${fmtNum(b.energy_today_kwh,2)}</span>
        </div>
        <div class="card-footer-item border-l border-slate-200 pl-2">
          <span class="card-footer-label">Energi Bulan Ini (kWh)</span>
          <span class="card-footer-value text-primary">${fmtNum(b.energy_month_kwh,2)}</span>
        </div>
      </div>
    </div>`;
  }

  function loadBuildings() {
    fetch('/api/view/buildings')
      .then(r => r.json())
      .then(list => {
        if (!list.length) return;
        const grid = document.getElementById('building-grid');

        // Sesuaikan jumlah kolom dengan jumlah building (max 4)
        const cols = Math.min(list.length, 4);
        grid.style.gridTemplateColumns = `repeat(${cols},1fr)`;

        // Jika > 4 building, tambah baris kedua
        if (list.length > 4) {
          grid.style.gridTemplateRows = 'repeat(2,1fr)';
        }

        grid.innerHTML = list.map(buildingCard).join('');
      }).catch(()=>{});
  }

  // ── Alarm Panel (dalam grid kolom terakhir jika slot tersedia) ────────────
  // Alarm ditampilkan sebagai overlay kecil di pojok kanan atas jika ada
  function loadAlarms() {
    // Alarm sudah ter-reflect di card state (warna merah/kuning)
    // Panel terpisah tidak ada di layout ini — info sudah di card
  }

  // ── Phase Balance ─────────────────────────────────────────────────────────
  function loadPhaseBalance() {
    fetch('/api/view/phase-balance')
      .then(r => r.json())
      .then(list => {
        const tbody = document.getElementById('phase-tbody');
        if (!list.length) {
          tbody.innerHTML = '<tr><td colspan="5" class="text-center text-slate-300 text-[10px] py-2">Tidak ada data</td></tr>';
          return;
        }
        tbody.innerHTML = list.map(row => {
          const ok    = row.is_ok;
          const barW  = Math.min(Math.round(row.imbalance_pct * 5), 100);
          const ibarC = ok ? 'ibar-ok' : 'ibar-warn';
          const ipctC = ok ? 'ipct-ok' : 'ipct-warn';
          const nameC = ok ? '' : 'style="color:#b45309;font-weight:700"';
          return `<tr>
            <td ${nameC}>${row.building_name}</td>
            <td>${fmtNum(row.phase_R,1)}</td>
            <td>${fmtNum(row.phase_S,1)}</td>
            <td>${fmtNum(row.phase_T,1)}</td>
            <td>
              <div class="ibar-wrap"><div class="ibar ${ibarC}" style="width:${barW}%"></div></div>
              <span class="ipct ${ipctC}">${row.imbalance_pct}%</span>
            </td>
          </tr>`;
        }).join('');
      }).catch(()=>{});
  }

  // ── Load Distribution ─────────────────────────────────────────────────────
  function loadDistribution() {
    fetch('/api/view/load-distribution')
      .then(r => r.json())
      .then(d => {
        const container = document.getElementById('load-bars');
        const maxKwh    = d.max_kwh || 1;

        container.innerHTML = d.buildings.map((b, i) => {
          const pct = Math.max(Math.round((b.kwh / maxKwh) * 100), 2);
          const val = b.kwh >= 100 ? Math.round(b.kwh) : b.kwh.toFixed(1);
          const shortName = b.name.replace(/^(Gedung|Departement|Dept\.?)\s*/i, '').substring(0,8);
          return `
            <div class="bar-col">
              <div class="bar-val">${val}</div>
              <div class="bar-track">
                <div class="bar-fill" style="height:${pct}%;background:${BAR_COLORS[i % BAR_COLORS.length]}"></div>
              </div>
              <div class="bar-name">${shortName}</div>
            </div>`;
        }).join('');

        document.getElementById('load-axis-max').textContent = fmtNum(maxKwh,1) + ' kWh';
        document.getElementById('load-total').textContent    = fmtKwh(d.total_kwh) + ' kWh';

        const topEl = document.getElementById('load-top');
        if (d.top_name && d.top_pct) {
          topEl.innerHTML = `${d.top_name} menyumbang <span>${d.top_pct}%</span> dari total beban`;
        } else {
          topEl.textContent = 'Tidak ada data hari ini';
        }
      }).catch(()=>{});
  }

  // ── Boot ──────────────────────────────────────────────────────────────────
  function loadRT()   { loadBuildings(); loadPhaseBalance(); }
  function loadSlow() { loadHeader(); loadDistribution(); }

  loadSlow();
  loadRT();

  setInterval(loadRT,   REFRESH_RT_MS);
  setInterval(loadSlow, REFRESH_SLOW_MS);

})();
</script>
</body>
</html>
