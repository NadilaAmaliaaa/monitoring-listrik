<!-- sidebar.html -->
<aside id="sidebar" class="sidebar-container">
  <div class="sidebar-content">
    <!-- Header/Logo -->
    <div class="sidebar-header">
      <div class="logo-container">
        <div class="logo-icon">
          <span class="material-symbols-outlined">electric_bolt</span>
        </div>
        <div class="logo-text">
          <h1 class="logo-title">EnergyMon</h1>
          <p class="logo-subtitle">v2.0 Enterprise</p>
        </div>
      </div>
    </div>

    <!-- Navigation Menu -->
    <nav class="sidebar-nav">
      <a href="/" class="nav-item active" data-page="dashboard">
        <span class="material-symbols-outlined fill-1">dashboard</span>
        <span class="nav-text">Dashboard Utama</span>
      </a>
      <a href="/analytics" class="nav-item" data-page="analytics">
        <span class="material-symbols-outlined">insights</span>
        <span class="nav-text">Data Analitik</span>
      </a>
      <a href="/reports" class="nav-item" data-page="reports">
        <span class="material-symbols-outlined">description</span>
        <span class="nav-text">Laporan Berkala</span>
      </a>
      <a href="/alarms" class="nav-item" data-page="alarms">
        <span class="material-symbols-outlined">warning</span>
        <span class="nav-text">Riwayat Alarms</span>
      </a>
      <a href="/settings" class="nav-item" data-page="settings">
        <span class="material-symbols-outlined">settings</span>
        <span class="nav-text">Ubah Nilai Ambang</span>
      </a>
    </nav>

    <!-- User Profile -->
    <div class="sidebar-footer">
      <div class="user-profile">
        <div class="user-avatar" style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuDn-71cxcqeXb-NXQeN0I6pXurlcCbQkNrRVoAFXqvqpGP_ZxTaWDwzwmdm3bCGaKYeRsZXyGU5E8zmgsCzy8nTVRleImEcZFrrFFD2LzfK3dDczjDY_6LR7_pm5iPRpJjfrzJ8mCLPc7h5oc6te-tTyq0UkL1fChyH42sYazsozvlo8_f26r84FmYoNgxYJGf3yeGwgLbn4YKFBzAFxSgF5yyQCAURwaZhr7pakZRc7svo1hTONH0Mcg1KSMPF9mCKnxkFp3tecVI')"></div>
        <div class="user-info">
          <p class="user-name">{{ current_user_name or 'Admin User' }}</p>
          <p class="user-role">{{ current_building.name if current_building else 'Engineering Dept' }}</p>
        </div>
        <!-- Logout button -->
        <a href="{{ url_for('auth.logout') }}"
           class="logout-btn"
           title="Keluar"
           onclick="return confirm('Yakin ingin keluar?')">
          <span class="material-symbols-outlined">logout</span>
        </a>
      </div>
    </div>

  </div>

  <!-- Toggle Button -->
  <button id="sidebarToggle" class="sidebar-toggle" title="Toggle Sidebar">
    <span class="material-symbols-outlined">chevron_left</span>
  </button>
</aside>
